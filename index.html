<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мои ссылки</title>
<style>
  :root {
    --bg: #14181a;
    --surface: #1d2326;
    --surface-hover: #242b2f;
    --text: #e9e7e0;
    --text-dim: #8a938f;
    --accent: #c9a24a;
    --border: #2b3236;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 64px 20px;
  }

  main {
    width: 100%;
    max-width: 440px;
  }

  .avatar {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--border);
    margin: 0 auto 20px;
    display: block;
  }

  h1 {
    text-align: center;
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 6px;
    letter-spacing: 0.01em;
  }

  p.tagline {
    text-align: center;
    color: var(--text-dim);
    font-size: 15px;
    margin: 0 0 40px;
    line-height: 1.5;
  }

  ul.links {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  ul.links a {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 15px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  ul.links a:hover {
    background: var(--surface-hover);
    border-color: var(--accent);
  }

  ul.links a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  footer {
    text-align: center;
    margin-top: 48px;
    color: var(--text-dim);
    font-size: 12px;
  }

  @media (prefers-reduced-motion: reduce) {
    ul.links a { transition: none; }
  }
</style>
</head>
<body>
<main>

  <!-- Замени на свою картинку (можешь убрать тег img, если не нужен) -->
  <!-- <img class="avatar" src="avatar.jpg" alt=""> -->

  <!-- Твоё имя / ник -->
  <h1>Имя Фамилия</h1>

  <!-- Короткое описание (можно удалить, если не нужно) -->
  <p class="tagline">Короткая подпись о себе</p>

  <!-- Список ссылок: скопируй блок <li>...</li> и меняй href и текст -->
  <ul class="links">
    <li><a href="https://t.me/your_channel">Telegram</a></li>
    <li><a href="https://github.com/your_username">GitHub</a></li>
    <li><a href="https://your-site.com">Сайт</a></li>
  </ul>

  <footer>&nbsp;</footer>

</main>
</body>
</html>
