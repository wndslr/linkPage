<!DOCTYPE html>
<html lang="ru">
<head>
<link rel="icon" href="favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wndslr links</title>
<style>
  :root {
    --bg: #161616;
    --surface: #222222;
    --surface-hover: #2a2a2a;
    --text: #ececec;
    --text-dim: #949494;
    --accent: #ececec;
    --border: #333333;
  }
    
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 20px 64px;
  }

  main {
    width: 100%;
    max-width: 440px;
  }

  .avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--border);
    margin: 0 auto 7px;
    display: block;
  }

  h1 {
    text-align: center;
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 20px;
    letter-spacing: 0.01em;
  }

  p.tagline {
    text-align: center;
    color: var(--text-dim);
    font-size: 15px;
    margin: 0 0 40px;
    line-height: 1.5;
  }

  ul.links {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  ul.links a {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 15px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  ul.links a:hover {
    background: var(--surface-hover);
    border-color: var(--accent);
  }

  ul.links a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  footer {
    text-align: center;
    margin-top: 48px;
    color: var(--text-dim);
    font-size: 12px;
  }

  @media (prefers-reduced-motion: reduce) {
    ul.links a { transition: none; }
  }
</style>
</head>
<body>
<main>

  <img class="avatar" src="F1AtNight.jpg" alt="">

  <h1>wndslr</h1>

  <ul class="links">
    <li><a href="https://t.me/wndslr">Telegram</a></li>
    <li><a href="https://github.com/wndslr">GitHub</a></li>
    <li><a href="https://twitch.tv/wndslr_">Twitch</a></li>
    <li><a href="https://steamcommunity.com/id/wndslr">Steam</a></li>
    <li><a href="https://pin.it/2GMroFOk7">Pinterest &lt; ??</a></li>
    <li><a href="ucant.html">ㅤ</a></li>
  </ul>

  <footer>&nbsp;</footer>

</main>
</body>
</html>
